name: Bug Report
description: Report a bug or unexpected behavior in the macro editor or autocomplete.
title: "[Bug]: <Short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the form below to help us reproduce and fix the issue.
  
  - type: input
    id: system
    attributes:
      label: Game System & Version
      description: What game system are you running, and what is its version?
      placeholder: e.g., dnd5e v4.0.3 or pf2e v6.1.2
    validations:
      required: false

  - type: input
    id: foundry_version
    attributes:
      label: Foundry VTT Version
      description: Which version and build of Foundry VTT are you using?
      placeholder: e.g., V12 Build 328, V13 Build 330, or V14
    validations:
      required: false

  - type: textarea
    id: active_modules
    attributes:
      label: Relevant Active Modules
      description: List any active modules that might interact with the macro editor, code editors, or UI (e.g. Monaco, CodeMirror, etc.).
      placeholder: e.g., monaco-editor, etc.
    validations:
      required: false

  - type: dropdown
    id: troubleshooting
    attributes:
      label: Basic Troubleshooting
      description: Have you tried disabling other modules to see if the issue persists? (A clean environment helps isolate conflicts).
      options:
        - "Yes, and the bug still occurs in a clean environment"
        - "No, I cannot disable other modules right now"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is and what you expected to happen.
      placeholder: Describe what is happening...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Explain exactly how we can reproduce the bug, step-by-step.
      placeholder: |
        1. Open a Macro configuration sheet...
        2. In the command textarea, type "game.user."...
        3. Press Tab...
        4. See error or unexpected behavior...
    validations:
      required: true

  - type: textarea
    id: console_errors
    attributes:
      label: Console Errors / Logs
      description: If applicable, press F12, open the console, and paste any red error logs or stack traces here.
      placeholder: Paste console errors here...
    validations:
      required: false
