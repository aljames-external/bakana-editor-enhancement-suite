name: Feature Request
description: Suggest an idea, improvement, or new feature for the macro editor.
title: "[Feature]: <Short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Bakana's Editor Enhancement Suite even better? We'd love to hear it!
        
        Please describe your suggestion below.
  
  - type: dropdown
    id: scope
    attributes:
      label: Feature Scope
      description: Is this feature core (system-agnostic editor feature) or specific to a particular game system/module?
      options:
        - "Core Editor (System-agnostic / applies to all systems)"
        - "System-specific (e.g., D&D 5e, PF2e, PF1)"
        - "Module-specific (e.g., Sequencer, Tagger, etc.)"
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target System / Module (If applicable)
      description: If this is system or module-specific, please specify which one.
      placeholder: e.g., Sequencer or D&D 5e
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description of the Feature
      description: Describe the feature or improvement you would like to see in detail.
      placeholder: Explain your idea...
    validations:
      required: true
